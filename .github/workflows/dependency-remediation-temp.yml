name: Dependency remediation (temporary)

on:
  push:
    branches: [clean-implementation]

permissions:
  contents: write

jobs:
  remediate:
    if: "contains(github.event.head_commit.message, 'chore: run dependency remediation')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only || true

      - name: Upgrade sqlite3 away from vulnerable node-gyp chain
        run: npm install --save --package-lock-only sqlite3@^6.0.1

      - name: Validate clean install
        run: npm ci

      - name: Require no high or critical advisories
        run: npm audit --audit-level=high

      - name: Run self-contained security unit tests
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-jwt-secret-not-for-production-use-000000000000000000000000
        run: npm run test:unit -- --runInBand

      - name: Commit validated dependency changes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(deps): remediate vulnerable dependency tree'
          git push

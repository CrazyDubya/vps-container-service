[tool:pytest]
# Pytest configuration for VPS Secure Compute Manager
minversion = 7.2
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Markers for test organization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    security: marks tests as security-focused tests
    performance: marks tests as performance tests
    cli: marks tests as CLI tests
    auth: marks tests as authentication tests
    containers: marks tests as container management tests
    quotas: marks tests as quota management tests
    e2e: marks tests as end-to-end tests

# Output options
addopts = 
    --strict-markers
    --strict-config
    --disable-warnings
    --tb=short
    -ra

# Test discovery
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache

# Minimum coverage
# addopts = --cov=vps_secure_compute_manager --cov-report=term-missing --cov-fail-under=80

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:asyncio